name: Build Android APK
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip find_my_cni_expo.zip
      - uses: actions/setup-node@v4
        with: 
          node-version: 18
      - uses: expo/expo-github-action@v8
        with: 
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - run: cd $(ls -d */ | head -1) && npm install
      - run: cd $(ls -d */ | head -1) && eas build -p android --profile production --non-interactive
