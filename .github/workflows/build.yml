name: Build Android APK
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip find_my_cni_expo.zip
      - run: cd Find_my_cni_Expo && npm install
      - uses: actions/setup-node@v4
        with: 
          node-version: 18
      - uses: expo/expo-github-action@v8
        with: 
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          working-directory: Find_my_cni_Expo   # ← ON TRAVAILLE DANS LE DOSSIER
      - run: cd Find_my_cni_Expo && eas build -p android --profile production --non-interactive --auto-submit=false
