name: Build Android APK
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip find_my_cni_expo.zip
      
      # ← ON SUPPRIME L'ANCIEN EAS.JSON + ON AJOUTE OWNER
      - run: |
          cd $(ls -d */ | head -1)
          rm -f eas.json
          cat > eas.json << EOF
          {
            "cli": {
              "appVersionSource": "remote"
            },
            "build": {
              "production": {
                "android": {
                  "buildType": "apk"
                }
              }
            }
          }
          EOF
          # ← ON AJOUTE OWNER + PROJECT ID DANS APP.JSON
          node -e "const fs=require('fs'); let app=JSON.parse(fs.readFileSync('app.json')); app.expo=app.expo||{}; app.expo.owner='lover1ers-team'; app.expo.extra=app.expo.extra||{}; app.expo.extra.eas={projectId:'337fe799-ca92-43f1-9976-23c73973a294'}; fs.writeFileSync('app.json', JSON.stringify(app,null,2))"

      - uses: actions/setup-node@v4
        with: 
          node-version: 18
      - uses: expo/expo-github-action@v8
        with: 
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          
      - run: cd $(ls -d */ | head -1) && npm install
      - run: cd $(ls -d */ | head -1) && eas whoami
      - run: cd $(ls -d */ | head -1) && eas build -p android --profile production --non-interactive
