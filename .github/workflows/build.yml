name: Build Android APK
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip find_my_cni_expo.zip
      
      # ← ON CRÉE EAS.JSON + ON INJECTE LE PROJECT ID
      - run: |
          cd $(ls -d */ | head -1)
          cat > eas.json << EOF
          {
            "cli": {
              "appVersionSource": "remote"
            },
            "build": {
              "production": {
                "android": {
                  "buildType": "apk"
                }
              }
            }
          }
          EOF
          # ON AJOUTE LE PROJECT ID DANS APP.JSON
          node -e "const fs=require('fs'); let app=JSON.parse(fs.readFileSync('app.json')); app.expo={...app.expo, extra:{eas:{projectId:'lover1ers-team/find-my-cni'}}}; fs.writeFileSync('app.json', JSON.stringify(app,null,2))"

      - uses: actions/setup-node@v4
        with: 
          node-version: 18
      - uses: expo/expo-github-action@v8
        with: 
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          
      - run: cd $(ls -d */ | head -1) && npm install
      - run: cd $(ls -d */ | head -1) && eas whoami
      - run: cd $(ls -d */ | head -1) && eas build -p android --profile production --non-interactive
